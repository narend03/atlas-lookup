name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npm test
      # Black-box check: ingest the sample CSV, boot the API, verify every row over HTTP.
      - run: npm run ingest
      - run: (npm start &) && sleep 2 && npm run verify -- http://localhost:3000
